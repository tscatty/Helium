name: Build Helium (macos-15-intel)

on:
  push:
    branches:
      - "scrolltext"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install Homebrew dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install dpkg ldid make libplist openssl@3
          echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Checkout theos
        uses: actions/checkout@v4
        with:
          repository: XXTouchNG/theos
          ref: 78ee784d8d3238982c9abdc58cd39919263648b1
          path: theos
          submodules: recursive

      - name: Use the SDK shipped with Xcode (matches the Swift 6 compiler)
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          rm -rf "$GITHUB_WORKSPACE/theos/sdks"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          DEV=$(xcode-select -p)
          SDK_VER=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_DIR=$(ls -d "$DEV"/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS${SDK_VER}.sdk 2>/dev/null || ls -d "$DEV"/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk)
          ln -s "$SDK_DIR" "$GITHUB_WORKSPACE/theos/sdks/iPhoneOS${SDK_VER}.sdk"
          ls -l "$GITHUB_WORKSPACE/theos/sdks"
          echo "SDK_VER=$SDK_VER" >> $GITHUB_ENV
          xcrun --sdk iphoneos --show-sdk-version

      - name: Checkout Helium
        uses: actions/checkout@v4
        with:
          path: Helium

      - name: Stub private frameworks missing from the modern SDK
        run: |
          STUB="$RUNNER_TEMP/private-stubs"
          mkdir -p "$STUB"
          printf 'int helium_private_stub = 0;
' > "$RUNNER_TEMP/stub.c"
          SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          for FW in BackBoardServices GraphicsServices SpringBoardServices; do
            mkdir -p "$STUB/$FW.framework"
            xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 -arch arm64e               -dynamiclib -x c "$RUNNER_TEMP/stub.c"               -isysroot "$SDKPATH" -o "$STUB/$FW.framework/$FW"               -install_name "/System/Library/PrivateFrameworks/$FW.framework/$FW"
            lipo -info "$STUB/$FW.framework/$FW" || true
          done
          echo "STUB=$STUB" >> $GITHUB_ENV
          ls -l "$STUB"/*/*

      - name: Build
        run: |
          set -o pipefail
          export THEOS=$GITHUB_WORKSPACE/theos
          export PATH="$THEOS/bin:$PATH"
          cd $GITHUB_WORKSPACE/Helium
          make clean || true
          make FINALPACKAGE=1 -j3             TARGET="iphone:clang:${SDK_VER}:14.0"             Helium_LDFLAGS="-F$STUB -Wl,-undefined,dynamic_lookup"
          find .theos/obj -maxdepth 2 -name "Helium.app" -type d

      - name: Assemble tipa
        run: |
          cd $GITHUB_WORKSPACE/Helium
          APP_DIR=$(find .theos/obj -maxdepth 2 -name "Helium.app" -type d | head -1)
          echo "app: $APP_DIR"
          SRC=layout/Applications/Helium.app
          cp "$SRC/icon.png" "$SRC/Info.plist" "$SRC/Assets.car" "$APP_DIR/"
          cp -r "$SRC/en.lproj" "$SRC/zh-Hans.lproj" "$SRC/fonts" "$SRC/credits" "$APP_DIR/"
          mkdir -p build/Payload
          rm -rf build/Payload/Helium.app
          cp -r "$APP_DIR" build/Payload/Helium.app
          cd build
          zip -qry Helium.tipa Payload
          ls -l Helium.tipa
          unzip -l Helium.tipa | head -12

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Helium-scrolltext.tipa
          path: ${{ github.workspace }}/Helium/build/Helium.tipa
          if-no-files-found: error